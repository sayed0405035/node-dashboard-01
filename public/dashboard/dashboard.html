<!DOCTYPE html>
<html lang="en">
<head>
  <title>Admin Dashboard</title>

  <!-- Bootstrap CDN -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <div class="container mt-5">

    <!-- Header Row -->
    <div class="d-flex align-items-center mb-4 pt-3 position-relative">

      <!-- Center Dashboard Title -->
      <h2 class="mx-auto mb-0 text-center">
        📊 Admin Dashboard
      </h2>

      <!-- Right Buttons -->
      <div class="position-absolute end-0">

        <a href="../sign-in/signin.html" class="btn btn-outline-primary me-2">
          Sign In
        </a>

        <a href="../sign-up/signup.html" class="btn btn-primary">
          Sign Up
        </a>

      </div>

    </div>

    <!-- Cards Section -->
    <div class="row text-center">

      <div class="col-md-4">
        <div class="card dashboard-card">
          <h4>Users</h4>
          <p class="fs-3">120</p>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card dashboard-card">
          <h4>Sales</h4>
          <p class="fs-3">$5,300</p>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card dashboard-card">
          <h4>Orders</h4>
          <p class="fs-3">85</p>
        </div>
      </div>

    </div>

    <!-- Chart Section -->
    <div class="mt-5">
      <canvas id="myChart"></canvas>
    </div>

  </div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom Chart File -->
  <script src="../js/chart.js"></script>

</body>
</html>
